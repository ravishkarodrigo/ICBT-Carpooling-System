# Runs the whole stack with: docker compose up --build
# Backend defaults to the in-memory data store so reviewers can run it without
# Firebase credentials. Set USE_IN_MEMORY_DB=false and provide FIREBASE_* vars
# in a .env file to use Firestore.
services:
  backend:
    build: ./backend
    container_name: carpool-backend
    ports:
      - "5001:5000"
    environment:
      NODE_ENV: production
      PORT: 5000
      CLIENT_ORIGIN: http://localhost:8080
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      USE_IN_MEMORY_DB: ${USE_IN_MEMORY_DB:-true}
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID:-}
      FIREBASE_CLIENT_EMAIL: ${FIREBASE_CLIENT_EMAIL:-}
      FIREBASE_PRIVATE_KEY: ${FIREBASE_PRIVATE_KEY:-}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:5000/api/health"]
      interval: 30s
      timeout: 3s
      retries: 3

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:5001/api
        VITE_SOCKET_URL: http://localhost:5001
    container_name: carpool-frontend
    ports:
      - "8080:80"
    depends_on:
      - backend
